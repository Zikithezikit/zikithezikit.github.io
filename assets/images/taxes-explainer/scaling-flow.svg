&quot;ח</text><text x="145.0" y="208.0" font-size="12.5" fill="#fff" text-anchor="middle" direction="rtl">אחרי ניפוח: ≈ 1,350 ש&quot;ח</text><line x1="690.0" y1="125.0" x2="560.0" y2="175.0" stroke="#4b5563" stroke-width="2"/><polygon points="560,175 552,170 552,180" fill="#4b5563"/><line x1="690.0" y1="245.0" x2="560.0" y2="205.0" stroke="#4b5563" stroke-width="2"/><polygon points="560,205 552,200 552,210" fill="#4b5563"/><line x1="370.0" y1="190.0" x2="250.0" y2="190.0" stroke="#4b5563" stroke-width="2"/><polygon points="250,190 242,185 242,195" fill="#4b5563"/><text x="450.0" y="320.0" font-size="11" fill="#6b7280" text-anchor="middle" direction="rtl">כל משק בית מוכפל באותו יחס. ההנחה: הדיווח החסר דומה בכל משקי הבית</text></svg>