<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Gini index of income per standard person"><rect width="900" height="380" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">Gini index of income per standard person</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Chart on page 45 of the paper. 0 is perfect equality, so lower means more equal</text><line x1="70.0" y1="290.0" x2="870.0" y2="290.0" stroke="#e5e7eb" stroke-width="1"/><text x="64.0" y="294.0" font-size="10.5" fill="#6b7280" text-anchor="end">0.0</text><line x1="70.0" y1="240.0" x2="870.0" y2="240.0" stroke="#e5e7eb" stroke-width="1"/><text x="64.0" y="244.0" font-size="10.5" fill="#6b7280" text-anchor="end">0.1</text><line x1="70.0" y1="190.0" x2="870.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/><text x="64.0" y="194.0" font-size="10.5" fill="#6b7280" text-anchor="end">0.2</text><line x1="70.0" y1="140.0" x2="870.0" y2="140.0" stroke="#e5e7eb" stroke-width="1"/><text x="64.0" y="144.0" font-size="10.5" fill="#6b7280" text-anchor="end">0.3</text><line x1="70.0" y1="90.0" x2="870.0" y2="90.0" stroke="#e5e7eb" stroke-width="1"/><text x="64.0" y="94.0" font-size="10.5" fill="#6b7280" text-anchor="end">0.4</text><rect x="90.0" y="114.5" width="93.3" height="175.5" fill="#1f77b4"/><text x="136.7" y="109.5" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">0.351</text><text x="136.7" y="308.0" font-size="11" fill="#1f2937" text-anchor="middle">Cash income</text><text x="136.7" y="323.0" font-size="11" fill="#1f2937" text-anchor="middle">after tax</text><rect x="223.3" y="127.0" width="93.3" height="163.0" fill="#1f77b4"/><text x="270.0" y="122.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">0.326</text><text x="270.0" y="308.0" font-size="11" fill="#1f2937" text-anchor="middle">Total income</text><text x="270.0" y="323.0" font-size="11" fill="#1f2937" text-anchor="middle">after tax</text><rect x="356.7" y="161.0" width="93.3" height="129.0" fill="#1f77b4"/><text x="403.3" y="156.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">0.258</text><text x="403.3" y="308.0" font-size="11" fill="#1f2937" text-anchor="middle">Paper's main</text><text x="403.3" y="323.0" font-size="11" fill="#1f2937" text-anchor="middle">analysis</text><rect x="490.0" y="186.5" width="93.3" height="103.5" fill="#ff7f0e"/><text x="536.7" y="181.5" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">0.207</text><text x="536.7" y="308.0" font-size="11" fill="#1f2937" text-anchor="middle">Central + defense,</text><text x="536.7" y="323.0" font-size="11" fill="#1f2937" text-anchor="middle">split by person</text><rect x="623.3" y="169.0" width="93.3" height="121.0" fill="#ff7f0e"/><text x="670.0" y="164.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">0.242</text><text x="670.0" y="308.0" font-size="11" fill="#1f2937" text-anchor="middle">Central + defense,</text><text x="670.0" y="323.0" font-size="11" fill="#1f2937" text-anchor="middle">split by spending</text><rect x="756.7" y="148.0" width="93.3" height="142.0" fill="#ff7f0e"/><text x="803.3" y="143.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">0.284</text><text x="803.3" y="308.0" font-size="11" fill="#1f2937" text-anchor="middle">Central + defense,</text><text x="803.3" y="323.0" font-size="11" fill="#1f2937" text-anchor="middle">split by income</text><text x="450.0" y="370.0" font-size="11.5" fill="#6b7280" text-anchor="middle">The three orange bars add defense and infrastructure, split in three different ways</text></svg>