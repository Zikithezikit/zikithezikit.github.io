<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Who carries each tax, in the paper"><rect width="900" height="420" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">Who carries each tax, in the paper</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">The paper's assumption for each tax. Where the law says one thing and the paper another, the paper's view is shown</text><rect x="40" y="80" width="400" height="50" rx="6" fill="#fbdede" stroke="#d62728" stroke-width="1.5"/><text x="240.0" y="109.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Income tax</text><rect x="520" y="80" width="340" height="50" rx="6" fill="#d9e8f5" stroke="#1f77b4" stroke-width="1.5"/><text x="690.0" y="109.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">The worker</text><path d="M440.0,105.0 L520.0,105.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="520,105 512,100 512,110" fill="#4b5563"/><rect x="40" y="144" width="400" height="50" rx="6" fill="#fbdede" stroke="#d62728" stroke-width="1.5"/><text x="240.0" y="173.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">VAT and fuel excise</text><rect x="520" y="144" width="340" height="50" rx="6" fill="#d9e8f5" stroke="#1f77b4" stroke-width="1.5"/><text x="690.0" y="173.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">The consumer</text><path d="M440.0,169.0 L520.0,169.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="520,169 512,164 512,174" fill="#4b5563"/><rect x="40" y="208" width="400" height="50" rx="6" fill="#fbdede" stroke="#d62728" stroke-width="1.5"/><text x="240.0" y="228.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">National Insurance and health tax</text><text x="240.0" y="246.0" font-size="12.5" fill="#1f2937" text-anchor="middle">(including the employer part)</text><rect x="520" y="208" width="340" height="50" rx="6" fill="#d9e8f5" stroke="#1f77b4" stroke-width="1.5"/><text x="690.0" y="237.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">The employee</text><path d="M440.0,233.0 L520.0,233.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="520,233 512,228 512,238" fill="#4b5563"/><rect x="40" y="272" width="400" height="50" rx="6" fill="#fbdede" stroke="#d62728" stroke-width="1.5"/><text x="240.0" y="292.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Corporate tax, diesel tax, business property tax,</text><text x="240.0" y="310.0" font-size="12.5" fill="#1f2937" text-anchor="middle">business share of vehicle tax</text><rect x="520" y="272" width="340" height="50" rx="6" fill="#d9e8f5" stroke="#1f77b4" stroke-width="1.5"/><text x="690.0" y="292.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">One third each: consumers,</text><text x="690.0" y="310.0" font-size="12.5" fill="#1f2937" text-anchor="middle">workers, owners of capital</text><path d="M440.0,297.0 L520.0,297.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="520,297 512,292 512,302" fill="#4b5563"/><rect x="40" y="336" width="400" height="50" rx="6" fill="#fbdede" stroke="#d62728" stroke-width="1.5"/><text x="240.0" y="365.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Property tax on homes</text><rect x="520" y="336" width="340" height="50" rx="6" fill="#d9e8f5" stroke="#1f77b4" stroke-width="1.5"/><text x="690.0" y="365.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">The household</text><path d="M440.0,361.0 L520.0,361.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="520,361 512,356 512,366" fill="#4b5563"/><text x="450.0" y="410.0" font-size="11.5" fill="#6b7280" text-anchor="middle">Cash benefits and services are counted by who uses them, which comes next</text></svg>