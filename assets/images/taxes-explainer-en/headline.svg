<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Headline result: who pays more than they get"><rect width="900" height="340" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">Headline result: who pays more than they get</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Share of households in each group, and the average net transfer per household per month. Summary figures, rounded. 2018 data</text><rect x="190.0" y="66.0" width="12.0" height="12.0" fill="#c0615a"/><text x="208.0" y="77.0" font-size="12.5" fill="#1f2937" text-anchor="start">Pay more than they get</text><rect x="380.0" y="66.0" width="12.0" height="12.0" fill="#5b8fb9"/><text x="398.0" y="77.0" font-size="12.5" fill="#1f2937" text-anchor="start">Get more than they pay</text><text x="178.0" y="140.0" font-size="13" fill="#1f2937" text-anchor="end" font-weight="bold">Non-Haredi Jews</text><rect x="190.0" y="110.0" width="294.0" height="44.0" fill="#c0615a"/><rect x="484.0" y="110.0" width="126.0" height="44.0" fill="#5b8fb9"/><text x="337.0" y="137.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">70%</text><text x="547.0" y="137.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">30%</text><text x="626.0" y="137.0" font-size="12.5" fill="#1f2937" text-anchor="start">pays about $1,900 more a month</text><text x="178.0" y="210.0" font-size="13" fill="#1f2937" text-anchor="end" font-weight="bold">Haredi Jews</text><rect x="190.0" y="180.0" width="84.0" height="44.0" fill="#c0615a"/><rect x="274.0" y="180.0" width="336.0" height="44.0" fill="#5b8fb9"/><text x="232.0" y="207.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">20%</text><text x="442.0" y="207.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">80%</text><text x="626.0" y="207.0" font-size="12.5" fill="#1f2937" text-anchor="start">gets about $1,300 more a month</text><text x="178.0" y="280.0" font-size="13" fill="#1f2937" text-anchor="end" font-weight="bold">Arab citizens</text><rect x="190.0" y="250.0" width="168.0" height="44.0" fill="#c0615a"/><rect x="358.0" y="250.0" width="252.0" height="44.0" fill="#5b8fb9"/><text x="274.0" y="277.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">40%</text><text x="484.0" y="277.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">60%</text><text x="626.0" y="277.0" font-size="12.5" fill="#1f2937" text-anchor="start">gets about $310 more a month</text><text x="450.0" y="330.0" font-size="11.5" fill="#6b7280" text-anchor="middle">Percentages and averages are the rounded figures in the paper's summary (p. 2)</text></svg>