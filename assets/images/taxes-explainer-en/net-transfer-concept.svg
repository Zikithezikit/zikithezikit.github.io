<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How the paper measures a net transfer"><rect width="900" height="430" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">How the paper measures a net transfer</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">For every household, the paper adds up what it pays and what it gets, then subtracts</text><rect x="350" y="80" width="200" height="60" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.8"/><text x="450.0" y="114.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">The state</text><rect x="350" y="240" width="200" height="60" rx="6" fill="#eef8ea" stroke="#5a9b4a" stroke-width="1.8"/><text x="450.0" y="274.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">One household</text><path d="M400.0,240.0 L400.0,140.0" fill="none" stroke="#c0615a" stroke-width="2"/><polygon points="400,140 395,148 405,148" fill="#c0615a"/><path d="M500.0,140.0 L500.0,240.0" fill="none" stroke="#5b8fb9" stroke-width="2"/><polygon points="500,240 495,232 505,232" fill="#5b8fb9"/><text x="388.0" y="175.0" font-size="13" fill="#b8473d" text-anchor="end" font-weight="bold">Taxes borne</text><text x="388.0" y="193.0" font-size="11.5" fill="#1f2937" text-anchor="end">income tax, VAT, social</text><text x="388.0" y="208.0" font-size="11.5" fill="#1f2937" text-anchor="end">insurance, and more</text><text x="512.0" y="175.0" font-size="13" fill="#3a78ac" text-anchor="start" font-weight="bold">Services and cash</text><text x="512.0" y="193.0" font-size="11.5" fill="#1f2937" text-anchor="start">schools, health care,</text><text x="512.0" y="208.0" font-size="11.5" fill="#1f2937" text-anchor="start">benefits, and more</text><path d="M450.0,300.0 L450.0,335.0" fill="none" stroke="#6b7280" stroke-width="2"/><polygon points="450,335 445,327 455,327" fill="#6b7280"/><rect x="230" y="335" width="440" height="56" rx="6" fill="#fff7dc" stroke="#c4972f" stroke-width="1.8"/><text x="450.0" y="358.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Net transfer = services received minus taxes borne</text><text x="450.0" y="376.0" font-size="12.5" fill="#1f2937" text-anchor="middle">Positive: gets more than it pays. Negative: pays more</text><text x="450.0" y="420.0" font-size="11.5" fill="#6b7280" text-anchor="middle">A teacher's salary counts as a service to the families whose kids are in the school</text></svg>