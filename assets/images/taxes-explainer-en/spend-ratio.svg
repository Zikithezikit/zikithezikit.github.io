<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How much the top decile receives compared to the bottom decile"><rect width="900" height="430" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">How much the top decile receives compared to the bottom decile</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Top decile value divided by bottom decile value, per type of spending. Figures from charts 19 to 27 of the paper. 2018</text><line x1="250.0" y1="70.0" x2="250.0" y2="376.0" stroke="#e5e7eb" stroke-width="1"/><text x="250.0" y="392.0" font-size="10.5" fill="#6b7280" text-anchor="middle">×0</text><line x1="394.4" y1="70.0" x2="394.4" y2="376.0" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3"/><text x="394.4" y="392.0" font-size="10.5" fill="#6b7280" text-anchor="middle">×1</text><line x1="538.9" y1="70.0" x2="538.9" y2="376.0" stroke="#e5e7eb" stroke-width="1"/><text x="538.9" y="392.0" font-size="10.5" fill="#6b7280" text-anchor="middle">×2</text><line x1="683.3" y1="70.0" x2="683.3" y2="376.0" stroke="#e5e7eb" stroke-width="1"/><text x="683.3" y="392.0" font-size="10.5" fill="#6b7280" text-anchor="middle">×3</text><rect x="250.0" y="76.0" width="504.2" height="22.0" fill="#1f77b4"/><text x="242.0" y="92.0" font-size="12" fill="#1f2937" text-anchor="end">Culture, sport and leisure</text><text x="760.2" y="92.0" font-size="11.5" fill="#1f2937" text-anchor="start">×3.49</text><rect x="250.0" y="110.0" width="154.4" height="22.0" fill="#1f77b4"/><text x="242.0" y="126.0" font-size="12" fill="#1f2937" text-anchor="end">Health</text><text x="410.4" y="126.0" font-size="11.5" fill="#1f2937" text-anchor="start">×1.07</text><rect x="250.0" y="144.0" width="142.8" height="22.0" fill="#ff7f0e"/><text x="242.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="end">Cash benefits</text><text x="398.8" y="160.0" font-size="11.5" fill="#1f2937" text-anchor="start">×0.99</text><rect x="250.0" y="178.0" width="109.5" height="22.0" fill="#ff7f0e"/><text x="242.0" y="194.0" font-size="12" fill="#1f2937" text-anchor="end">Higher education</text><text x="365.5" y="194.0" font-size="11.5" fill="#1f2937" text-anchor="start">×0.76</text><rect x="250.0" y="212.0" width="69.8" height="22.0" fill="#ff7f0e"/><text x="242.0" y="228.0" font-size="12" fill="#1f2937" text-anchor="end">Public transport</text><text x="325.8" y="228.0" font-size="11.5" fill="#1f2937" text-anchor="start">×0.48</text><rect x="250.0" y="246.0" width="62.9" height="22.0" fill="#ff7f0e"/><text x="242.0" y="262.0" font-size="12" fill="#1f2937" text-anchor="end">Welfare services</text><text x="318.9" y="262.0" font-size="11.5" fill="#1f2937" text-anchor="start">×0.44</text><rect x="250.0" y="280.0" width="60.2" height="22.0" fill="#ff7f0e"/><text x="242.0" y="296.0" font-size="12" fill="#1f2937" text-anchor="end">Schools (K-12)</text><text x="316.2" y="296.0" font-size="11.5" fill="#1f2937" text-anchor="start">×0.42</text><rect x="250.0" y="314.0" width="34.9" height="22.0" fill="#ff7f0e"/><text x="242.0" y="330.0" font-size="12" fill="#1f2937" text-anchor="end">Religion</text><text x="290.9" y="330.0" font-size="11.5" fill="#1f2937" text-anchor="start">×0.24</text><rect x="250.0" y="348.0" width="5.0" height="22.0" fill="#ff7f0e"/><text x="242.0" y="364.0" font-size="12" fill="#1f2937" text-anchor="end">Public housing</text><text x="261.0" y="364.0" font-size="11.5" fill="#1f2937" text-anchor="start">×0.03</text><text x="394.4" y="68.0" font-size="10.5" fill="#6b7280" text-anchor="middle">equal (×1)</text><text x="450.0" y="420.0" font-size="11.5" fill="#6b7280" text-anchor="middle">Below 1 the top decile gets less than the bottom decile. Above 1 it gets more</text></svg>