<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Why the paper stops at 2018"><rect width="900" height="360" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">Why the paper stops at 2018</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Share of sampled households that answered the Household Expenditure Survey</text><line x1="78.0" y1="290.0" x2="870.0" y2="290.0" stroke="#9ca3af" stroke-width="1.2"/><text x="70.0" y="294.0" font-size="11" fill="#6b7280" text-anchor="end">0</text><line x1="78.0" y1="237.5" x2="870.0" y2="237.5" stroke="#e5e7eb" stroke-width="1"/><text x="70.0" y="241.5" font-size="11" fill="#6b7280" text-anchor="end">25</text><line x1="78.0" y1="185.0" x2="870.0" y2="185.0" stroke="#e5e7eb" stroke-width="1"/><text x="70.0" y="189.0" font-size="11" fill="#6b7280" text-anchor="end">50</text><line x1="78.0" y1="132.5" x2="870.0" y2="132.5" stroke="#e5e7eb" stroke-width="1"/><text x="70.0" y="136.5" font-size="11" fill="#6b7280" text-anchor="end">75</text><line x1="78.0" y1="80.0" x2="870.0" y2="80.0" stroke="#e5e7eb" stroke-width="1"/><text x="70.0" y="84.0" font-size="11" fill="#6b7280" text-anchor="end">100</text><rect x="107.0" y="132.5" width="203.9" height="157.5" fill="#5b8fb9"/><text x="209.0" y="128.5" font-size="10.5" fill="#1f2937" text-anchor="middle">75%</text><text x="210.0" y="308.0" font-size="12.5" fill="#1f2937" text-anchor="middle">2016 to 2018</text><rect x="371.0" y="155.6" width="203.9" height="134.4" fill="#5b8fb9"/><text x="473.0" y="151.6" font-size="10.5" fill="#1f2937" text-anchor="middle">64%</text><text x="474.0" y="308.0" font-size="12.5" fill="#1f2937" text-anchor="middle">2019</text><rect x="635.0" y="197.6" width="203.9" height="92.4" fill="#5b8fb9"/><text x="737.0" y="193.6" font-size="10.5" fill="#1f2937" text-anchor="middle">44%</text><text x="738.0" y="308.0" font-size="12.5" fill="#1f2937" text-anchor="middle">2020 and 2021</text><text x="450.0" y="350.0" font-size="11.5" fill="#6b7280" text-anchor="middle">Rounded from about 75% (74.9 to 75.5), about 64%, and 44.4%. CBS also changed its method in 2019</text></svg>