<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="From survey to household estimate: the VAT example"><rect width="900" height="330" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">From survey to household estimate: the VAT example</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Illustration. $20.5bn and $27.7bn come from the paper (Table 1, converted). The $280 household is made up</text><rect x="30.0" y="90.0" width="230.0" height="70.0" fill="#2563eb"/><text x="145.0" y="113.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">Household survey</text><text x="145.0" y="132.0" font-size="12.5" fill="#fff" text-anchor="middle">VAT found: $20.5bn</text><rect x="30.0" y="210.0" width="230.0" height="70.0" fill="#374151"/><text x="145.0" y="233.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">Official tax data</text><text x="145.0" y="252.0" font-size="12.5" fill="#fff" text-anchor="middle">VAT collected: $27.7bn</text><rect x="340.0" y="150.0" width="220.0" height="80.0" fill="#7c3aed"/><text x="450.0" y="173.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">Scaling factor</text><text x="450.0" y="192.0" font-size="12.5" fill="#fff" text-anchor="middle">27.7 / 20.5</text><text x="450.0" y="211.0" font-size="12.5" fill="#fff" text-anchor="middle">≈ 1.35</text><rect x="650.0" y="150.0" width="220.0" height="80.0" fill="#059669"/><text x="760.0" y="173.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">One household</text><text x="760.0" y="192.0" font-size="12.5" fill="#fff" text-anchor="middle">Reported: $280 a month</text><text x="760.0" y="211.0" font-size="12.5" fill="#fff" text-anchor="middle">Counted: ≈ $375</text><line x1="260.0" y1="125.0" x2="340.0" y2="175.0" stroke="#4b5563" stroke-width="2"/><polygon points="340,175 332,170 332,180" fill="#4b5563"/><line x1="260.0" y1="245.0" x2="340.0" y2="205.0" stroke="#4b5563" stroke-width="2"/><polygon points="340,205 332,200 332,210" fill="#4b5563"/><line x1="560.0" y1="190.0" x2="650.0" y2="190.0" stroke="#4b5563" stroke-width="2"/><polygon points="650,190 642,185 642,195" fill="#4b5563"/><text x="450.0" y="320.0" font-size="11.5" fill="#6b7280" text-anchor="middle">Every household is multiplied by the same factor. This assumes under-reporting is similar everywhere</text></svg>