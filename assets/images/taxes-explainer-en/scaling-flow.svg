<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="From survey to household estimate: the VAT example"><rect width="900" height="330" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">From survey to household estimate: the VAT example</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">Illustration. $23.3bn and $31.4bn come from Table 1 of the paper, converted at 3.18 NIS per $. The $310 household is made up</text><rect x="30" y="90" width="230" height="70" rx="6" fill="#1f77b4" stroke="#1f77b4" stroke-width="1.5"/><text x="145.0" y="120.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Household survey</text><text x="145.0" y="138.0" font-size="12.5" fill="#ffffff" text-anchor="middle">VAT found: $23.3bn</text><rect x="30" y="210" width="230" height="70" rx="6" fill="#374151" stroke="#374151" stroke-width="1.5"/><text x="145.0" y="240.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Official tax data</text><text x="145.0" y="258.0" font-size="12.5" fill="#ffffff" text-anchor="middle">VAT collected: $31.4bn</text><rect x="340" y="140" width="220" height="100" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="450.0" y="176.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Scaling factor</text><text x="450.0" y="194.0" font-size="12.5" fill="#ffffff" text-anchor="middle">31.4 / 23.3</text><text x="450.0" y="212.0" font-size="12.5" fill="#ffffff" text-anchor="middle">about 1.35</text><rect x="650" y="140" width="220" height="100" rx="6" fill="#047857" stroke="#047857" stroke-width="1.5"/><text x="760.0" y="176.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">One household</text><text x="760.0" y="194.0" font-size="12.5" fill="#ffffff" text-anchor="middle">Reports: $310 a month</text><text x="760.0" y="212.0" font-size="12.5" fill="#ffffff" text-anchor="middle">Counted: about $420</text><path d="M260.0,125.0 L300.0,125.0 L300.0,170.0 L340.0,170.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="340,170 332,165 332,175" fill="#4b5563"/><path d="M260.0,245.0 L300.0,245.0 L300.0,210.0 L340.0,210.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="340,210 332,205 332,215" fill="#4b5563"/><path d="M560.0,190.0 L650.0,190.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="650,190 642,185 642,195" fill="#4b5563"/><text x="450.0" y="320.0" font-size="11.5" fill="#6b7280" text-anchor="middle">Every household is multiplied by the same factor. This assumes under-reporting is similar everywhere</text></svg>