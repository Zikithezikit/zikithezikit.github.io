<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Who carries the corporate tax"><rect width="900" height="400" rx="10" fill="#ffffff"/><text x="450.0" y="30.0" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">Who carries the corporate tax</text><text x="450.0" y="53.0" font-size="12.5" fill="#6b7280" text-anchor="middle">The paper's assumption: one third each, then assigned to households by their share</text><rect x="325" y="80" width="250" height="56" rx="6" fill="#1f77b4" stroke="#1f77b4" stroke-width="1.5"/><text x="450.0" y="103.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Corporate tax</text><text x="450.0" y="121.0" font-size="12.5" fill="#ffffff" text-anchor="middle">counted as a third each</text><rect x="40" y="190" width="230" height="56" rx="6" fill="#fde3c8" stroke="#ff7f0e" stroke-width="1.5"/><text x="155.0" y="213.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">One third on consumers</text><text x="155.0" y="231.0" font-size="12.5" fill="#1f2937" text-anchor="middle">higher prices</text><rect x="335" y="190" width="230" height="56" rx="6" fill="#fde3c8" stroke="#ff7f0e" stroke-width="1.5"/><text x="450.0" y="213.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">One third on workers</text><text x="450.0" y="231.0" font-size="12.5" fill="#1f2937" text-anchor="middle">lower pay</text><rect x="630" y="190" width="230" height="56" rx="6" fill="#fde3c8" stroke="#ff7f0e" stroke-width="1.5"/><text x="745.0" y="213.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">One third on owners of capital</text><text x="745.0" y="231.0" font-size="12.5" fill="#1f2937" text-anchor="middle">lower profits</text><rect x="40" y="300" width="230" height="56" rx="6" fill="#d9efd8" stroke="#2ca02c" stroke-width="1.5"/><text x="155.0" y="323.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Split by spending</text><text x="155.0" y="341.0" font-size="12.5" fill="#1f2937" text-anchor="middle">share of consumption</text><rect x="335" y="300" width="230" height="56" rx="6" fill="#d9efd8" stroke="#2ca02c" stroke-width="1.5"/><text x="450.0" y="323.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Split by labor income</text><text x="450.0" y="341.0" font-size="12.5" fill="#1f2937" text-anchor="middle">share of wages</text><rect x="630" y="300" width="230" height="56" rx="6" fill="#d9efd8" stroke="#2ca02c" stroke-width="1.5"/><text x="745.0" y="323.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Split by capital income</text><text x="745.0" y="341.0" font-size="12.5" fill="#1f2937" text-anchor="middle">share of capital income</text><path d="M375.0,136.0 L375.0,163.0 L155.0,163.0 L155.0,190.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="155,190 150,182 160,182" fill="#4b5563"/><path d="M450.0,136.0 L450.0,190.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="450,190 445,182 455,182" fill="#4b5563"/><path d="M525.0,136.0 L525.0,163.0 L745.0,163.0 L745.0,190.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="745,190 740,182 750,182" fill="#4b5563"/><path d="M155.0,246.0 L155.0,300.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="155,300 150,292 160,292" fill="#4b5563"/><path d="M450.0,246.0 L450.0,300.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="450,300 445,292 455,292" fill="#4b5563"/><path d="M745.0,246.0 L745.0,300.0" fill="none" stroke="#4b5563" stroke-width="2"/><polygon points="745,300 740,292 750,292" fill="#4b5563"/><text x="450.0" y="390.0" font-size="11.5" fill="#6b7280" text-anchor="middle">The literature gives wide ranges, so the paper uses an even split</text></svg>