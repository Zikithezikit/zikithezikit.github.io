<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Diagram of one round: random weights theta 0 are trained, the smallest 20% of weights are pruned to make a mask, the survivors are rewound to theta 0, and the rewound network is retrained and pruned again; a control keeps the mask but draws fresh random weights"><rect width="900" height="470" rx="10" fill="#ffffff"/><text x="450" y="30" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">One round of the lottery ticket procedure</text><text x="450" y="53" font-size="12.5" fill="#6b7280" text-anchor="middle">Repeat until the mask is as sparse as you want. The original weights are kept the whole time.</text><rect x="40" y="100" width="160" height="76" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="120" y="138" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">θ0</text><text x="120" y="158" font-size="12" fill="#6b7280" text-anchor="middle">random initialization</text><rect x="290" y="100" width="170" height="76" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="375" y="138" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">train</text><text x="375" y="158" font-size="12" fill="#6b7280" text-anchor="middle">to completion, giving θT</text><rect x="560" y="100" width="170" height="76" rx="6" fill="#fff7dc" stroke="#c4972f" stroke-width="1.4"/><text x="645" y="138" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">prune</text><text x="645" y="158" font-size="12" fill="#6b7280" text-anchor="middle">drop smallest 20% of |w|</text><rect x="560" y="250" width="170" height="76" rx="6" fill="#e8fbf3" stroke="#13805c" stroke-width="1.4"/><text x="645" y="288" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">rewind</text><text x="645" y="308" font-size="12" fill="#6b7280" text-anchor="middle">survivors back to θ0</text><defs><marker id="m15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs><path d="M200,138 L290,138" fill="none" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#m15)"/><defs><marker id="m16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs><path d="M460,138 L560,138" fill="none" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#m16)"/><defs><marker id="m17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs><path d="M645,176 L645,250" fill="none" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#m17)"/><text x="660" y="218" font-size="12.5" fill="#6b7280" text-anchor="start">mask m</text><defs><marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#13805c"/></marker></defs><path d="M560,288 H375 V176" fill="none" stroke="#13805c" stroke-width="1.8" marker-end="url(#loop)"/><text x="467" y="280" font-size="12.5" fill="#6b7280" text-anchor="middle">retrain m ⊙ θ0,</text><text x="467" y="306" font-size="12.5" fill="#6b7280" text-anchor="middle">then prune again</text><rect x="290" y="380" width="440" height="62" rx="6" fill="#fff7dc" stroke="#b8473d" stroke-width="1.4"/><text x="510" y="416" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">control: same mask m, fresh random weights θ′</text><defs><marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8473d"/></marker></defs><path d="M730,138 H800 V411 H730" fill="none" stroke="#b8473d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ctl)"/><text x="808" y="260" font-size="12.5" fill="#6b7280" text-anchor="start">same</text><text x="808" y="278" font-size="12.5" fill="#6b7280" text-anchor="start">mask,</text><text x="808" y="296" font-size="12.5" fill="#6b7280" text-anchor="start">new</text><text x="808" y="314" font-size="12.5" fill="#6b7280" text-anchor="start">weights</text></svg>