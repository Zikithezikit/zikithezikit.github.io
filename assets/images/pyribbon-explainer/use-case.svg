<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A filter in front of a database"><rect width="900" height="420" rx="10" fill="#ffffff"/><text x="450.0" y="30" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">A filter in front of a database</text><text x="450.0" y="53" font-size="12.5" fill="#6b7280" text-anchor="middle">Measured with pyribbon: 2M stored keys, 10M lookups, 95% of them for keys that do not exist</text><rect x="40" y="150" width="150" height="80" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.8"/><text x="115.0" y="176.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">10,000,000</text><text x="115.0" y="194.55" font-size="11.5" fill="#1f2937" text-anchor="middle">lookups</text><text x="115.0" y="212.55" font-size="11.5" fill="#1f2937" text-anchor="middle">500,000 are real keys</text><line x1="190" y1="190" x2="261.0" y2="190.0" stroke="#6b7280" stroke-width="2"/><polygon points="270,190 261.8,193.7 261.8,186.3" fill="#6b7280"/><rect x="270" y="130" width="200" height="120" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="370.0" y="176.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Ribbon filter</text><text x="370.0" y="194.55" font-size="11.5" fill="#1f2937" text-anchor="middle">2,000,000 keys, 2.27 MB</text><text x="370.0" y="212.55" font-size="11.5" fill="#1f2937" text-anchor="middle">fp_bits = 8</text><line x1="470" y1="165" x2="582.1" y2="104.3" stroke="#13805c" stroke-width="2"/><polygon points="590,100 584.5,107.1 581.0,100.7" fill="#13805c"/><text x="500" y="112" font-size="13" fill="#13805c" text-anchor="start" font-weight="bold">"no"</text><line x1="470" y1="215" x2="582.2" y2="280.5" stroke="#c4972f" stroke-width="2"/><polygon points="590,285 581.1,284.0 584.8,277.7" fill="#c4972f"/><text x="500" y="282" font-size="13" fill="#8a6a14" text-anchor="start" font-weight="bold">"maybe"</text><rect x="590" y="60" width="270" height="80" rx="6" fill="#e8fbf3" stroke="#5a9b4a" stroke-width="1.8"/><text x="725.0" y="95.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">9,463,064 lookups</text><text x="725.0" y="113.55" font-size="11.5" fill="#1f2937" text-anchor="middle">answered in memory, no disk read</text><rect x="590" y="250" width="270" height="100" rx="6" fill="#fff7dc" stroke="#c4972f" stroke-width="1.8"/><text x="725.0" y="286.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">536,936 lookups hit the database</text><text x="725.0" y="304.55" font-size="11.5" fill="#1f2937" text-anchor="middle">500,000 real hits</text><text x="725.0" y="322.55" font-size="11.5" fill="#1f2937" text-anchor="middle">36,936 wasted (false positives)</text><text x="450" y="386" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Without the filter: 10,000,000 database reads. With it: 536,936, a drop of 94.6%.</text></svg>