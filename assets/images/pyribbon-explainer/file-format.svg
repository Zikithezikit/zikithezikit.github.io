<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="The pyribbon file format"><rect width="900" height="508" rx="10" fill="#ffffff"/><text x="450.0" y="30" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">What to_bytes() writes</text><text x="450.0" y="53" font-size="12.5" fill="#6b7280" text-anchor="middle">A 64-byte header, then the table. Both parts carry an XXH3 checksum</text><text x="116" y="84" font-size="11.5" fill="#6b7280" text-anchor="end">offset</text><text x="171.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+0</text><text x="253.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+1</text><text x="335.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+2</text><text x="417.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+3</text><text x="499.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+4</text><text x="581.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+5</text><text x="663.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+6</text><text x="745.0" y="84" font-size="11.5" fill="#6b7280" text-anchor="middle">+7</text><text x="116" y="117.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">0</text><rect x="130" y="96" width="656" height="34" rx="0" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="458.0" y="117.0" font-size="11.5" fill="#1f2937" text-anchor="middle">magic "PYRIBBON"</text><text x="116" y="151.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">8</text><rect x="130" y="130" width="164" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="212.0" y="151.0" font-size="11.5" fill="#1f2937" text-anchor="middle">version</text><rect x="294" y="130" width="164" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="376.0" y="151.0" font-size="11.5" fill="#1f2937" text-anchor="middle">header size</text><rect x="458" y="130" width="82" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="499.0" y="151.0" font-size="10.5" fill="#1f2937" text-anchor="middle">w</text><rect x="540" y="130" width="82" height="34" rx="0" fill="#fff7dc" stroke="#c4972f" stroke-width="1.4"/><text x="581.0" y="151.0" font-size="10.5" fill="#1f2937" text-anchor="middle">r</text><rect x="622" y="130" width="82" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="663.0" y="151.0" font-size="10.5" fill="#1f2937" text-anchor="middle">hash</text><rect x="704" y="130" width="82" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="745.0" y="151.0" font-size="10.5" fill="#1f2937" text-anchor="middle">flg</text><text x="116" y="185.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">16</text><rect x="130" y="164" width="656" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="458.0" y="185.0" font-size="11.5" fill="#1f2937" text-anchor="middle">num_keys</text><text x="116" y="219.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">24</text><rect x="130" y="198" width="656" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="458.0" y="219.0" font-size="11.5" fill="#1f2937" text-anchor="middle">num_rows</text><text x="116" y="253.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">32</text><rect x="130" y="232" width="656" height="34" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.4"/><text x="458.0" y="253.0" font-size="11.5" fill="#1f2937" text-anchor="middle">seed</text><text x="116" y="287.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">40</text><rect x="130" y="266" width="328" height="34" rx="0" fill="#fff7dc" stroke="#c4972f" stroke-width="1.4"/><text x="294.0" y="287.0" font-size="11.5" fill="#1f2937" text-anchor="middle">attempt</text><rect x="458" y="266" width="328" height="34" rx="0" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="622.0" y="287.0" font-size="11.5" fill="#1f2937" text-anchor="middle">reserved (0)</text><text x="116" y="321.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">48</text><rect x="130" y="300" width="656" height="34" rx="0" fill="#e8fbf3" stroke="#5a9b4a" stroke-width="1.4"/><text x="458.0" y="321.0" font-size="11.5" fill="#1f2937" text-anchor="middle">payload_xxh3</text><text x="116" y="355.0" font-size="11.5" fill="#6b7280" text-anchor="end" font-family="Menlo, Consolas, monospace">56</text><rect x="130" y="334" width="656" height="34" rx="0" fill="#e8fbf3" stroke="#5a9b4a" stroke-width="1.4"/><text x="458.0" y="355.0" font-size="11.5" fill="#1f2937" text-anchor="middle">header_xxh3 (covers bytes 0 to 55)</text><rect x="130" y="384" width="656" height="56" rx="0" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.6"/><text x="458" y="408" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">payload from byte 64</text><text x="458" y="428" font-size="12" fill="#6b7280" text-anchor="middle">(num_rows / 64) blocks × r words × 8 bytes, little-endian</text><text x="450" y="462" font-size="11.5" fill="#1f2937" text-anchor="middle">w = width_log2 (always 6), r = fp_bits, hash = hash id (1), flg = flags (0)</text><text x="450" y="484" font-size="11.5" fill="#6b7280" text-anchor="middle">Every field is explicit and little-endian, so the same file reads the same on any machine. The loader checks all of it before touching the payload.</text></svg>