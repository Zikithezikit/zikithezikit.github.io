<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Interleaved column layout"><rect width="900" height="452" rx="10" fill="#ffffff"/><text x="450.0" y="30" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">How the table is laid out in memory, and how a query reads it</text><text x="450.0" y="53" font-size="12.5" fill="#6b7280" text-anchor="middle">Each block of 64 rows is stored as r words, one word per bit of the tag</text><text x="40" y="84" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Rows of Z, in blocks of 64</text><rect x="60.0" y="96" width="260.0" height="34" rx="0" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="190.0" y="118" font-size="12" fill="#1f2937" text-anchor="middle">block 0: rows 0 to 63</text><rect x="320.0" y="96" width="260.0" height="34" rx="0" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="450.0" y="118" font-size="12" fill="#1f2937" text-anchor="middle">block 1: rows 64 to 127</text><rect x="580.0" y="96" width="260.0" height="34" rx="0" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="710.0" y="118" font-size="12" fill="#1f2937" text-anchor="middle">block 2: rows 128 to 191</text><rect x="466.25" y="138" width="260.0" height="30" rx="4" fill="#e6eeff" stroke="#2F6BFF" stroke-width="2"/><text x="596.25" y="158" font-size="12" fill="#1d4fd0" text-anchor="middle" font-weight="bold">query window: rows 100 to 163</text><line x1="466.25" y1="130" x2="466.25" y2="138" stroke="#2F6BFF" stroke-width="2"/><line x1="726.25" y1="130" x2="726.25" y2="138" stroke="#2F6BFF" stroke-width="2"/><text x="332.0" y="190" font-size="12" fill="#6b7280" text-anchor="start">off = 100 mod 64 = 36 → the window starts 36 rows into block 1 and spills into block 2</text><text x="40" y="236" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">The same data in memory (r = 3 columns shown; real default is r = 8)</text><rect x="60" y="252" width="118" height="50" rx="5" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="119.0" y="274" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">W1,0</text><text x="119.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">64 bits, col 0</text><rect x="188" y="252" width="118" height="50" rx="5" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="247.0" y="274" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">W1,1</text><text x="247.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">64 bits, col 1</text><rect x="316" y="252" width="118" height="50" rx="5" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="375.0" y="274" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">W1,2</text><text x="375.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">64 bits, col 2</text><rect x="444" y="252" width="118" height="50" rx="5" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="503.0" y="274" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">W2,0</text><text x="503.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">64 bits, col 0</text><rect x="572" y="252" width="118" height="50" rx="5" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="631.0" y="274" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">W2,1</text><text x="631.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">64 bits, col 1</text><rect x="700" y="252" width="118" height="50" rx="5" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.4"/><text x="759.0" y="274" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">W2,2</text><text x="759.0" y="292" font-size="11" fill="#6b7280" text-anchor="middle">64 bits, col 2</text><text x="60" y="326" font-size="11.5" fill="#6b7280" text-anchor="start">block 1: r words, one per column</text><text x="444" y="326" font-size="11.5" fill="#6b7280" text-anchor="start">block 2: the next r words</text><rect x="40" y="344" width="820" height="92" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/><text x="56" y="370" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Column j of the answer:</text><text x="56" y="394" font-size="13" fill="#1d4fd0" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">parity( W[1][j] &amp; (c &lt;&lt; 36) )  XOR  parity( W[2][j] &amp; (c &gt;&gt; 28) )</text><text x="56" y="418" font-size="12" fill="#6b7280" text-anchor="start">Two 64-bit loads per column at most. The loop stops at the first column that disagrees with the tag.</text></svg>