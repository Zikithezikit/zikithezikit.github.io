<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="From the key alice to start, mask and tag"><rect width="900" height="638" rx="10" fill="#ffffff"/><text x="450.0" y="30" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">From a key to its equation, with the real numbers for "alice"</text><text x="450.0" y="53" font-size="12.5" fill="#6b7280" text-anchor="middle">Filter built from ["alice", "bob", "carol"] with fp_bits=12: 128 rows, so 128 − 63 = 65 possible starts</text><rect x="60" y="74" width="780" height="56" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6"/><text x="74" y="96" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Key</text><text x="826" y="96" font-size="13" fill="#1d4fd0" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace">"alice"  (a str)</text><text x="74" y="117" font-size="11.5" fill="#6b7280" text-anchor="start">The type matters: b"alice", "alice" and an int all hash differently.</text><line x1="450" y1="130" x2="450.0" y2="135.0" stroke="#6b7280" stroke-width="1.6"/><polygon points="450,144 446.3,135.8 453.7,135.8" fill="#6b7280"/><rect x="60" y="144" width="780" height="56" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6"/><text x="74" y="166" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">XXH3-64 of the UTF-8 bytes</text><text x="826" y="166" font-size="13" fill="#1d4fd0" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace">0x4da10dd61a0116b0</text><text x="74" y="187" font-size="11.5" fill="#6b7280" text-anchor="start">A stable, specified hash. Python's own hash() changes per process, so it is never used.</text><line x1="450" y1="200" x2="450.0" y2="205.0" stroke="#6b7280" stroke-width="1.6"/><polygon points="450,214 446.3,205.8 453.7,205.8" fill="#6b7280"/><rect x="60" y="214" width="780" height="56" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6"/><text x="74" y="236" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">XOR with a type tag  → h0</text><text x="826" y="236" font-size="13" fill="#1d4fd0" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace">0x27a8ebb1e9bddfb8</text><text x="74" y="257" font-size="11.5" fill="#6b7280" text-anchor="start">str keys use the tag 0x6a09e667f3bcc908 (a SHA-512 constant, so nothing up the sleeve).</text><line x1="450" y1="270" x2="450.0" y2="275.0" stroke="#6b7280" stroke-width="1.6"/><polygon points="450,284 446.3,275.8 453.7,275.8" fill="#6b7280"/><rect x="60" y="284" width="780" height="56" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6"/><text x="74" y="306" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Add the seed, then mix  → H</text><text x="826" y="306" font-size="13" fill="#1d4fd0" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace">0xe70178d084325472</text><text x="74" y="327" font-size="11.5" fill="#6b7280" text-anchor="start">H = mix64(h0 + mix64(seed + γ)). Seed 0 here.</text><line x1="450" y1="340" x2="450.0" y2="345.0" stroke="#6b7280" stroke-width="1.6"/><polygon points="450,354 446.3,345.8 453.7,345.8" fill="#6b7280"/><rect x="60" y="354" width="780" height="56" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6"/><text x="74" y="376" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">XOR with the attempt salt  → S</text><text x="826" y="376" font-size="13" fill="#1d4fd0" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace">0x0521d0e9ff2f99dd</text><text x="74" y="397" font-size="11.5" fill="#6b7280" text-anchor="start">salt = mix64((attempt + 1)·γ) = 0xe220a8397b1dcdaf. Attempt 0 here.</text><line x1="450" y1="410" x2="450.0" y2="415.0" stroke="#6b7280" stroke-width="1.6"/><polygon points="450,424 446.3,415.8 453.7,415.8" fill="#6b7280"/><rect x="60" y="424" width="780" height="56" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.6"/><text x="74" y="446" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">Three independent mixes</text><text x="826" y="446" font-size="13" fill="#1d4fd0" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace">z0 = 0x643053454382053c</text><text x="826" y="467" font-size="13" fill="#1d4fd0" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace">z1 = 0xdb575a9b8815f470      z2 = 0x896d3770ba648af1</text><line x1="200" y1="486" x2="200.0" y2="497.0" stroke="#2F6BFF" stroke-width="2"/><polygon points="200,506 196.3,497.8 203.7,497.8" fill="#2F6BFF"/><line x1="450" y1="486" x2="450.0" y2="497.0" stroke="#2F6BFF" stroke-width="2"/><polygon points="450,506 446.3,497.8 453.7,497.8" fill="#2F6BFF"/><line x1="700" y1="486" x2="700.0" y2="497.0" stroke="#2F6BFF" stroke-width="2"/><polygon points="700,506 696.3,497.8 703.7,497.8" fill="#2F6BFF"/><rect x="60" y="508" width="280" height="96" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="200.0" y="542.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">start = 25</text><text x="200.0" y="560.55" font-size="11.5" fill="#1f2937" text-anchor="middle">floor(z0 × 65 / 2^64). z0 is 39.1% of the</text><text x="200.0" y="578.55" font-size="11.5" fill="#1f2937" text-anchor="middle">way up its range, 0.391 × 65 = 25.4</text><rect x="360" y="508" width="250" height="96" rx="6" fill="#e8fbf3" stroke="#5a9b4a" stroke-width="1.8"/><text x="485.0" y="542.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">mask c = z1 OR 1</text><text x="485.0" y="560.55" font-size="11.5" fill="#1f2937" text-anchor="middle">0xdb575a9b8815f471</text><text x="485.0" y="578.55" font-size="11.5" fill="#1f2937" text-anchor="middle">34 of its 64 bits are set</text><rect x="630" y="508" width="210" height="96" rx="6" fill="#fff7dc" stroke="#c4972f" stroke-width="1.8"/><text x="735.0" y="542.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">tag b = top 12 bits of z2</text><text x="735.0" y="560.55" font-size="11.5" fill="#1f2937" text-anchor="middle">100010010110</text><text x="735.0" y="578.55" font-size="11.5" fill="#1f2937" text-anchor="middle">(0x896)</text><text x="450.0" y="624" font-size="11.5" fill="#6b7280" text-anchor="middle">Check: XOR the rows of Z selected by c, from row 25. The result is 100010010110, the same as b.</text></svg>