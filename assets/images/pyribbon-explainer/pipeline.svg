<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Build and query in pyribbon"><rect width="900" height="430" rx="10" fill="#ffffff"/><text x="450.0" y="30" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">Store equations, not keys</text><text x="450.0" y="53" font-size="12.5" fill="#6b7280" text-anchor="middle">Every key becomes one linear equation. The table Z is a solution to all of them at once</text><text x="40" y="88" font-size="13" fill="#1d4fd0" text-anchor="start" font-weight="bold">BUILD (once)</text><rect x="40" y="100" width="150" height="70" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.8"/><text x="115.0" y="130.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Your keys</text><text x="115.0" y="148.55" font-size="11.5" fill="#1f2937" text-anchor="middle">alice, bob, carol, …</text><line x1="190" y1="135" x2="221.0" y2="135.0" stroke="#6b7280" stroke-width="2"/><polygon points="230,135 221.8,138.7 221.8,131.3" fill="#6b7280"/><rect x="230" y="100" width="200" height="70" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="330.0" y="130.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">One equation per key</text><text x="330.0" y="148.55" font-size="11.5" fill="#1f2937" text-anchor="middle">start s · mask c · tag b</text><line x1="430" y1="135" x2="461.0" y2="135.0" stroke="#6b7280" stroke-width="2"/><polygon points="470,135 461.8,138.7 461.8,131.3" fill="#6b7280"/><rect x="470" y="100" width="190" height="70" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="565.0" y="130.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Solve them all</text><text x="565.0" y="148.55" font-size="11.5" fill="#1f2937" text-anchor="middle">banded elimination</text><line x1="660" y1="135" x2="691.0" y2="135.0" stroke="#6b7280" stroke-width="2"/><polygon points="700,135 691.8,138.7 691.8,131.3" fill="#6b7280"/><rect x="700" y="100" width="160" height="70" rx="6" fill="#e8fbf3" stroke="#5a9b4a" stroke-width="1.8"/><text x="780.0" y="130.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Table Z</text><text x="780.0" y="148.55" font-size="11.5" fill="#1f2937" text-anchor="middle">m rows of r bits</text><text x="768" y="190" font-size="11.5" fill="#13805c" text-anchor="end">this is the filter</text><line x1="40" y1="222" x2="860" y2="222" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><text x="40" y="255" font-size="13" fill="#c4972f" text-anchor="start" font-weight="bold">ASK (any time, any thread)</text><rect x="40" y="270" width="150" height="70" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.8"/><text x="115.0" y="300.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">A new key</text><text x="115.0" y="318.55" font-size="11.5" fill="#1f2937" text-anchor="middle">"mallory"</text><line x1="190" y1="305" x2="221.0" y2="305.0" stroke="#6b7280" stroke-width="2"/><polygon points="230,305 221.8,308.7 221.8,301.3" fill="#6b7280"/><rect x="230" y="270" width="200" height="70" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="330.0" y="300.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Same hash, same equation</text><text x="330.0" y="318.55" font-size="11.5" fill="#1f2937" text-anchor="middle">gives s, c, b again</text><line x1="430" y1="305" x2="461.0" y2="305.0" stroke="#6b7280" stroke-width="2"/><polygon points="470,305 461.8,308.7 461.8,301.3" fill="#6b7280"/><rect x="470" y="270" width="190" height="70" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="565.0" y="300.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">XOR the rows of Z</text><text x="565.0" y="318.55" font-size="11.5" fill="#1f2937" text-anchor="middle">that c selects, from s</text><line x1="660" y1="305" x2="691.0" y2="305.0" stroke="#6b7280" stroke-width="2"/><polygon points="700,305 691.8,308.7 691.8,301.3" fill="#6b7280"/><rect x="700" y="270" width="160" height="70" rx="6" fill="#fff7dc" stroke="#c4972f" stroke-width="1.8"/><text x="780.0" y="300.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Same as b?</text><text x="780.0" y="318.55" font-size="11.5" fill="#1f2937" text-anchor="middle">yes: "maybe"</text><text x="780" y="360" font-size="11.5" fill="#8a6a14" text-anchor="middle">no: "definitely not"</text><line x1="780" y1="170" x2="780.0" y2="249.0" stroke="#13805c" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="780,258 776.3,249.8 783.7,249.8" fill="#13805c"/><text x="792" y="222" font-size="11.5" fill="#13805c" text-anchor="start">read</text><text x="450" y="408" font-size="12" fill="#6b7280" text-anchor="middle">The filter stores the answers to the equations, not the keys. A key that was never added almost always gets a tag that does not match.</text></svg>