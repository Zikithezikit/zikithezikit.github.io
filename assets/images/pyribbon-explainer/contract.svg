<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="What a filter promises"><rect width="900" height="410" rx="10" fill="#ffffff"/><text x="450.0" y="30" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold">What a filter promises</text><text x="450.0" y="53" font-size="12.5" fill="#6b7280" text-anchor="middle">It answers "definitely not" or "maybe", and it is wrong only in one direction</text><rect x="40" y="170" width="130" height="60" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.8"/><text x="105.0" y="195.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">A key</text><text x="105.0" y="213.55" font-size="11.5" fill="#1f2937" text-anchor="middle">"alice", 42, bytes…</text><line x1="170" y1="200" x2="251.0" y2="200.0" stroke="#6b7280" stroke-width="2"/><polygon points="260,200 251.8,203.7 251.8,196.3" fill="#6b7280"/><rect x="260" y="140" width="220" height="120" rx="6" fill="#e6eeff" stroke="#2F6BFF" stroke-width="1.8"/><text x="370.0" y="185.9" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">Ribbon filter</text><text x="370.0" y="204.9" font-size="12.5" fill="#1f2937" text-anchor="middle">a few MB in memory</text><text x="370.0" y="223.9" font-size="12.5" fill="#1f2937" text-anchor="middle">built once, never changes</text><line x1="480" y1="180" x2="601.7" y2="128.5" stroke="#13805c" stroke-width="2"/><polygon points="610,125 603.9,131.6 601.0,124.8" fill="#13805c"/><text x="520" y="138" font-size="13" fill="#13805c" text-anchor="start" font-weight="bold">"no"</text><line x1="480" y1="220" x2="601.7" y2="271.5" stroke="#c4972f" stroke-width="2"/><polygon points="610,275 601.0,275.2 603.9,268.4" fill="#c4972f"/><text x="520" y="268" font-size="13" fill="#8a6a14" text-anchor="start" font-weight="bold">"maybe"</text><rect x="610" y="85" width="250" height="80" rx="6" fill="#e8fbf3" stroke="#5a9b4a" stroke-width="1.8"/><text x="735.0" y="120.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Definitely not in the set</text><text x="735.0" y="138.55" font-size="11.5" fill="#1f2937" text-anchor="middle">skip the database</text><rect x="610" y="235" width="250" height="80" rx="6" fill="#fff7dc" stroke="#c4972f" stroke-width="1.8"/><text x="735.0" y="270.55" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Probably in the set</text><text x="735.0" y="288.55" font-size="11.5" fill="#1f2937" text-anchor="middle">go and check</text><rect x="40" y="335" width="820" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/><text x="60" y="357" font-size="12.5" fill="#1f2937" text-anchor="start">A key the filter was built from always gets "maybe". There are no false negatives.</text><text x="60" y="376" font-size="12.5" fill="#1f2937" text-anchor="start">A key it was not built from gets "maybe" with probability 1 in 2^r. You choose r (the fp_bits setting).</text></svg>